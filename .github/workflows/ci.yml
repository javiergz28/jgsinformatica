name: JG Next Gen - DEV CI
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Verify site and accessibility baseline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check c6-7-preview.js
          node --check c6-11-preview.js
          node --check c6-11-c-review.js
          node --check c6-11-player.mjs
      - name: Test website requirements
        run: node --test tests/*.test.mjs

  build-pages:
    name: Assemble and upload validated DEV Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Assemble clean static website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/assets
          cp index.html styles.css script.js c6-7-preview.html c6-7-preview.css c6-7-preview.js c6-11-preview.html c6-11-preview.css c6-11-preview.js c6-11-player.mjs c6-11-c-review.html c6-11-c-review.css c6-11-c-review.js _site/
          cp assets/core-01.svg _site/assets/
          mkdir -p _site/assets/brand
          cp assets/brand/jg-nextgen-flat.svg assets/brand/jg-nextgen-favicon32.png _site/assets/brand/
          mkdir -p _site/assets/boot
          cp assets/boot/*.webp assets/boot/manifest.json _site/assets/boot/
          mkdir -p _site/assets/boot/sequence
          cp assets/boot/sequence/*.webp _site/assets/boot/sequence/
          mkdir -p _site/assets/boot/c6-7
          cp assets/boot/c6-7/*.webp assets/boot/c6-7/manifest.json _site/assets/boot/c6-7/
          mkdir -p _site/assets/boot/c6-11
          cp -R assets/boot/c6-11/desktop assets/boot/c6-11/mobile assets/boot/c6-11/manifest.json _site/assets/boot/c6-11/
          mkdir -p _site/assets/boot/c6-11-c-study
          cp assets/boot/c6-11-c-study/*.webp assets/boot/c6-11-c-study/manifest.json _site/assets/boot/c6-11-c-study/
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    name: Deploy validated DEV to GitHub Pages
    needs: build-pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
