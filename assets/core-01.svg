<svg xmlns="http://www.w3.org/2000/svg" width="900" height="850" viewBox="0 0 900 850" role="img" aria-labelledby="title desc">
  <title id="title">CORE-01: concepto de computadora modular</title>
  <desc id="desc">Gabinete oscuro con panel lateral de vidrio, un solo ventilador y acento cian discreto. Ilustración provisional para la fase DEV.</desc>
  <defs>
    <linearGradient id="metal" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#48515d"/><stop offset=".32" stop-color="#202934"/><stop offset="1" stop-color="#070b12"/></linearGradient>
    <linearGradient id="glass" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#24323b" stop-opacity=".55"/><stop offset="1" stop-color="#08151e" stop-opacity=".85"/></linearGradient>
    <linearGradient id="rim" x1="0" x2="1"><stop stop-color="#00d9e8" stop-opacity="0"/><stop offset=".56" stop-color="#00d9e8" stop-opacity=".56"/><stop offset="1" stop-color="#5ce7f0" stop-opacity=".1"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#00c4d8" stop-opacity=".19"/><stop offset="1" stop-color="#00c4d8" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <ellipse cx="505" cy="438" rx="335" ry="350" fill="url(#halo)"/>
  <ellipse cx="490" cy="748" rx="236" ry="28" fill="#010305" opacity=".86" filter="url(#blur)"/>
  <!-- One fixed chassis and continuous set of panels; no visual reassembly. -->
  <path d="M280 198 568 116 727 181 440 278Z" fill="#3e4c58" stroke="#798d9c" stroke-opacity=".3"/>
  <path d="M440 278 727 181 727 681 440 760Z" fill="url(#metal)" stroke="#687c87" stroke-opacity=".4" stroke-width="3"/>
  <path d="M280 198 440 278 440 760 280 676Z" fill="#0f1821" stroke="#687c87" stroke-opacity=".5" stroke-width="3"/>
  <path d="M296 233 425 296 425 718 296 648Z" fill="url(#glass)" stroke="#8aafb9" stroke-opacity=".2" stroke-width="2"/>
  <path d="M461 293 705 210 705 660 461 735Z" fill="#0a131c" stroke="#405764" stroke-opacity=".35"/>
  <path d="M474 308 694 233 694 644 474 710Z" fill="url(#glass)" stroke="#718591" stroke-opacity=".24"/>
  <!-- Motherboard plane, single GPU and restrained cooling rings -->
  <path d="M499 358 643 312 643 521 499 568Z" fill="#172831" stroke="#47616d" stroke-opacity=".45"/>
  <g opacity=".56" fill="none" stroke="#6f8791" stroke-width="2">
    <path d="M519 377 519 536M535 362 535 488M547 363 606 343M540 493 596 474M593 368 619 360 619 399M564 529 627 505"/>
  </g>
  <path d="M484 521 668 460 680 477 496 543Z" fill="#3d4b56" stroke="#8b9eaa" stroke-opacity=".6" stroke-width="2"/>
  <path d="M495 542 680 477 679 502 496 565Z" fill="#101b25"/>
  <g data-boot="gpu-light" opacity=".04"><path d="M496 545 679 480" stroke="url(#rim)" stroke-width="3"/></g>
  <ellipse cx="562" cy="289" rx="41" ry="47" fill="#121e27" stroke="#4c6370" stroke-width="4" transform="rotate(-18 562 289)"/>
  <ellipse cx="562" cy="289" rx="25" ry="29" fill="none" stroke="#73858c" stroke-opacity=".5" stroke-width="5" transform="rotate(-18 562 289)"/>
  <g data-boot="fan" transform="rotate(0 562 289)" opacity=".4">
    <path d="M547 275 575 302M547 302 576 273M542 289 581 289" stroke="#73858c" stroke-opacity=".38" stroke-width="6"/>
  </g>
  <g data-boot="cooler-light" opacity="0"><ellipse cx="562" cy="289" rx="41" ry="47" fill="none" stroke="#00d9e8" stroke-width="2" transform="rotate(-18 562 289)"/></g>
  <!-- One continuous cyan signature line, not a RGB spectacle -->
  <g data-boot="power-light" opacity=".08">
    <path d="M307 252 307 636" stroke="#00d9e8" stroke-width="3" stroke-linecap="round" opacity=".78"/>
    <path d="M307 252 307 636" stroke="#00d9e8" stroke-width="13" opacity=".11"/>
  </g>
  <path d="M294 213 420 274" stroke="#b3cbd3" stroke-opacity=".26"/>
  <path d="M456 288 714 202" stroke="#b3cbd3" stroke-opacity=".28"/>
  <rect x="320" y="691" width="76" height="2" rx="1" fill="#8a99a6" opacity=".65" transform="rotate(25 320 691)"/>
  <text x="472" y="755" fill="#adc3cf" opacity=".55" font-family="monospace" font-size="13" letter-spacing="4">CORE/01</text>
</svg>